services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DATABASE_URL: postgres://english_coach:${POSTGRES_PASSWORD}@postgres:5432/english_coach
    ports:
      - "3000:3000"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: english_coach
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: english_coach
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
